# Output/Monitor placement and terminal setup
font=Nerd Font:size=11 
terminal=foot -e
prompt="❯ "
icon-theme=breeze-dark
#icon-size=18                          # Explicitly size icons down (default is 32)

# UI Options
fields=filename,name,generic,exec,categories,keywords
password-character=*
show-actions=no
lines=7                               # Reduced visible list height (was 10)
width=40                              # Reduced character width (was 40)
tabs=4
horizontal-pad=12                     # Tighter side padding (was 20)
vertical-pad=8                        # Tighter top/bottom padding (was 12)
inner-pad=5                           # Spacing between prompt, input, and list (was 8)
# line-height is commented out so Fuzzel auto-sizes it cleanly based on font size

# Layout & Position
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=181818ff
text=ffffffff
match=787878ff
selection=78787880
selection-text=ffffffff
selection-match=ffffffff
border=808080ff

[border]
width=1
radius=0

[dmenu]
mode=text
exit-immediately-if-empty=no
